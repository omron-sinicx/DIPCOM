name: dipcom
camera_shape: [3, 92, 92] # for smaller images
diffusion_config:
  _target_: dipcom.envs.configuration_dipcom.DipcomConfig
  model: "TRANSFORMER"
  n_obs_steps: 2
  horizon: 46
  n_action_steps: 32
  temporal_ensemble_coeff: 0.01

  noise_scheduler_type: DDIM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon

  vision_backbone: resnet18
  # crop_shape: [84,84]
  crop_shape: null
  crop_is_random: True
  pretrained_backbone_weights: null
  use_group_norm: True
  spatial_softmax_num_keypoints: 32

  film:
    _target_: dipcom.envs.configuration_dipcom.FilmConfig
    down_dims: [512, 1024, 2048]
    kernel_size: 5
    n_groups: 8
    diffusion_step_embed_dim: 128
    use_film_scale_modulation: True

  transformer:
    _target_: dipcom.envs.configuration_dipcom.TransformerConfig
    n_layer: 8
    n_head: 4
    n_emb: 768
    p_drop_emb: 0.01
    p_drop_attn: 0.01
    causal_attn: True
    time_as_cond: True
    obs_as_cond: True
    n_cond_layers: 2

