[workspace]
authors = ["Cristian C. Beltran-Hernandez <cristian.beltran@sinicx.com>"]
channels = ["conda-forge"]
name = "dipcom_env"
version = "0.1.0"
description = "DIPCOM Environment with Robosuite"
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
einops = ">=0.8.1,<0.9"

[pypi-dependencies]
numpy = "*"
numba = "*"
scipy = "*"
pillow = "*"
termcolor = "*"
pytest = "*"
tqdm = "*"
h5py = "*"

# MuJoCo and rendering
mujoco = ">=3.3.0"
pyopengl = ">=3.1.7"
defusedxml = "==0.7.1"
mink = ">=0.0.5"
qpsolvers = { version = ">=4.3.1", extras = ["quadprog"] }
pynput = "*"
numpy-quaternion = "*"
gymnasium = ">=0.29.1,<1.0.0"
lerobot = "==0.3.3"
robosuite = { path = "./robosuite", editable = true }
dipcom = { path = "./dipcom", editable = true }
matplotlib = ">=3.10.8, <4"
colorama = ">=0.4.6, <0.5"
pyopengl-accelerate = ">=3.1.10, <4"
loguru = ">=0.7.3, <0.8"
timm = ">=1.0.22, <2"
hydra-core = ">=1.3.2, <2"

inputs = "*"
robosuite-models = "==1.0.0"
hidapi = "*"  # macOS only, but included for completeness
aim = ">=3.29.1, <4"
rich = ">=14.2.0, <15"
torchcodec = ">=0.5, <0.6"

[pypi-options.dependency-overrides]
# Override rerun-sdk version constraint from lerobot
# Allow any version to bypass platform compatibility issues
rerun-sdk = "*"

[environments]
default = { features = [], solve-group = "default" }
